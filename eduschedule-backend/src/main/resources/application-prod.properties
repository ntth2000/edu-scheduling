# Production profile — activated when SPRING_PROFILES_ACTIVE=prod
# Self-contained: in the prod Docker image, application.properties is NOT
# present (gitignored), so this file must define everything the app needs.

spring.application.name=eduschedule-backend

# Server
server.port=${PORT:8080}
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

# Database — all values injected via environment variables by the hosting platform
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — Flyway manages schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway — run migrations on startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate=true so that if the target DB already has tables
# (e.g. imported from dev), Flyway creates its history table at baseline
# version without failing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS (comma-separated list of allowed origins).
# The localhost default only exists so the app can start unconfigured — always override
# CORS_ALLOWED_ORIGINS with the real frontend origin(s) in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Timefold Solver — caps how long one /generate call may run.
# MUST stay here: application.properties is gitignored and therefore absent from the prod image,
# so without this line the solver would run with no time limit at all and the request would hang.
# 30s keeps the request comfortably inside the platform's HTTP timeout on small/shared-CPU
# instances. Raise it when running on dedicated CPU to let Local Search improve the soft score.
timefold.solver.default.termination.spent-limit=${TIMEFOLD_SPENT_LIMIT:30s}


# Logging — raise the jdbc/hikari/flyway loggers back to DEBUG temporarily when
# troubleshooting a first deploy on a new platform.
logging.level.root=INFO
logging.level.com.eduschedule=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.jdbc=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=WARN

# Disable devtools in prod (defensive — devtools is runtime-scoped)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# HikariCP — tuned for a 512MB container backed by a serverless Postgres that
# auto-suspends when idle. Keep the pool small and drop idle connections quickly
# so the database is free to suspend. Raise the pool size on a dedicated instance.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.initialization-fail-timeout=60000

# Actuator — expose only health, for the platform's liveness/readiness probes
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
